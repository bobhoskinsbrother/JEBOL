# The wasm build compiles in the Gradle daemon rather than a JVM of its own, so
# the daemon carries TeaVM's heap on top of its own. 512 MB is Gradle's default
# and the core does not fit in it; the compiler fails with an OutOfMemoryError
# rather than a message about memory. docs/decisions.md 54 says why there is no
# second process to give the memory to.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m

# With the configuration cache on, Gradle runs tasks of this one project in
# parallel, so the wasm build the end-to-end tests need compiles while the
# functional tests run instead of after them. Without it the gate sat for
# about 26 seconds between the two suites with no test running.
org.gradle.configuration-cache=true
