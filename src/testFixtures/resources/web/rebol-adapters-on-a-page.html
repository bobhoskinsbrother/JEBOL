<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>a script that reaches the outside</title>
<style>
  html, body { margin: 0; background: #101216; color: #d8dee9;
               font: 14px ui-monospace, monospace; }
  #out { white-space: pre-wrap; margin: 8px; }
  #console { display: block; margin: 8px; width: 40ch; }
</style>
</head>
<body>
<pre id="out"></pre>
<input id="console" autocomplete="off" placeholder="type a line and press enter">
<script type="text/rebol" id="rebol">
the-url: to url! rejoin [{THE-ORIGIN-URL} "/hello"]
print read the-url
print (read/binary the-url) = #{68656C6C6F}
if exists? %kept.txt [print rejoin ["again " read/string %kept.txt]]
write %kept.txt "kept"
print read/string %kept.txt
print input
print error? try [read tcp://127.0.0.1:1]
page: to url! rejoin [{THE-ORIGIN-URL} "/missing"]
e: try [read page]
print e/id
print mold checksum "abc" 'sha1
print mold checksum/with "abc" 'sha1 "key"
sized: make gob! [size: 200x40]
sized/text: "MMMM"
print size-text sized
</script>
<script>
const out = [];
const shown = document.getElementById('out');
const consoleInput = document.getElementById('console');

function say(text) {
  out.push(text);
  shown.textContent = out.join('') + '\n';
}

function theWorkerSays(message) {
  const said = typeof message.data === 'string' ? JSON.parse(message.data) : message.data;
  if (said.kind === 'paint') {
    return;
  }
  if (said.kind === 'printed') {
    say(said.text);
  } else if (said.kind === 'booted') {
    theWorker.postMessage({ run: document.getElementById('rebol').textContent
        .replaceAll('{THE-ORIGIN-URL}', '{' + location.origin + '}') });
  } else if (said.kind === 'finished') {
    say('finished ' + said.text);
  } else if (said.kind === 'failed') {
    say('failed ' + said.text);
  }
}

const theWorker = new Worker('jebol-worker.js');
theWorker.onmessage = theWorkerSays;
theWorker.onerror = problem => say('worker error ' + problem.message);

theWorker.postMessage({ kind: 'measure', wide: window.innerWidth, high: window.innerHeight });

consoleInput.addEventListener('keydown', pressed => {
  if (pressed.key === 'Enter') {
    theWorker.postMessage({ kind: 'line', text: consoleInput.value });
    consoleInput.value = '';
  }
});
</script>
</body>
</html>
