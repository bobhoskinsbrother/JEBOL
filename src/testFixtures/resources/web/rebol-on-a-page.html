<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>a script on a page</title>
<style>
  html, body { margin: 0; height: 100%; background: #101216; }
  canvas { display: block; }
  @font-face { font-family: 'Jebol Carried'; src: url('NotoSans-Regular.ttf'); }
</style>
</head>
<body>
<canvas id="screen"></canvas>
<script type="text/rebol" id="rebol">
print 1 + 2
print (compress/level "" 'br 0) = #{3B}
print (compress/level "test test test" 'br 0) = #{8B0680746573742074657374207465737403}
sentence: to binary! {The quick brown fox jumps over the lazy dog. The quick brown fox jumps again.}
print (compress/level sentence 'br 2) = #{
    1B4C000080AAAAAAEAFF74A5C3496F273D5C44CD44173335
    15333553DB06E0602C88C42431C09D364D963E2BC728D34A
    E8F634A2BD2C63DB4FECD6CE95952AFFC76CC9A1832692A4
    3407}
print (compress/level sentence 'br 3) = #{
    1B4C00000042B695EA85444B843260023E4C51FC4A16B2E2
    BAF44539468D0BA1DBD398EC651EDB7E62B776AEA2ACF27F
    24CB0E40B2D4E600}
print (compress/level sentence 'br 5) = (compress/level sentence 'br 9)
print (decompress (compress/level sentence 'br 11) 'br) = sentence
wait 0:00:00.05
print "waited"
</script>
<script type="text/rebol" id="gui">
the-window: view/no-wait make gob! [size: 100x100 color: 250.10.10]
the-window/offset: 20x30
show system/view/screen-gob
handle-events [
    name: 'watcher
    priority: 90
    handler: func [event] [
        print ["clicked" event/offset]
        event
    ]
]
print "open"
was: 0x0
forever [
    wait [system/ports/event 0:00:00.2]
    if was <> system/view/screen-gob/size [
        was: system/view/screen-gob/size
        print ["now" was]
    ]
]
</script>
<script>
const canvas = document.getElementById('screen');
const brush = canvas.getContext('2d');

let theLastPicture = null;

function paint(picture) {
  theLastPicture = picture;
  canvas.width = picture.wide;
  canvas.height = picture.high;
  brush.clearRect(0, 0, picture.wide, picture.high);
  for (const call of picture.paint) {
    paintOneCall(call);
  }
}

function paintOneCall(call) {
  brush.save();
  brush.beginPath();
  brush.rect(call.clip.across, call.clip.down, call.clip.wide, call.clip.high);
  brush.clip();
  if (call['clip-shape'] && call['clip-shape'].length) {
    clipToTheShape(call);
  }
  brush.globalAlpha = call.opacity / 255;
  if (call.type === 'fill') {
    fillThePath(call);
  } else if (call.type === 'stroke') {
    strokeThePath(call);
  } else if (call.type === 'picture') {
    showPicture(call);
  } else if (call.type === 'text') {
    writeTheText(call);
  }
  brush.restore();
}

function isIdentity(t) {
  return !t || (t[0] === 1 && t[1] === 0 && t[2] === 0
      && t[3] === 1 && t[4] === 0 && t[5] === 0);
}

function clipToTheShape(call) {
  const inside = asPath(call['clip-shape']);
  if (isIdentity(call.transform)) {
    brush.clip(inside);
    return;
  }
  const t = call.transform;
  const placed = new Path2D();
  placed.addPath(inside, new DOMMatrix([t[0], t[1], t[2], t[3], t[4], t[5]]));
  brush.clip(placed);
}

function applyTransform(call) {
  const t = call.transform;
  if (!isIdentity(t)) brush.transform(t[0], t[1], t[2], t[3], t[4], t[5]);
}

const capNames = { 'butt': 'butt', 'square': 'square', 'rounded': 'round' };
const joinNames = { 'miter': 'miter', 'miter-bevel': 'miter',
                    'round': 'round', 'bevel': 'bevel' };

function fillThePath(call) {
  applyTransform(call);
  brush.fillStyle = call.gradient ? asGradient(call.gradient) : call.colour;
  brush.fill(asPath(call.path), call.rule === 'even-odd' ? 'evenodd' : 'nonzero');
}

function strokeThePath(call) {
  applyTransform(call);
  brush.strokeStyle = call.colour;
  brush.lineWidth = call.width;
  brush.lineCap = capNames[call.cap];
  brush.lineJoin = joinNames[call.join];
  brush.setLineDash(call.dashes || []);
  brush.stroke(asPath(call.path));
  brush.setLineDash([]);
}

function showPicture(call) {
  applyTransform(call);
  const pixels = asImageData(call);
  const held = document.createElement('canvas');
  held.width = pixels.width;
  held.height = pixels.height;
  held.getContext('2d').putImageData(pixels, 0, 0);
  brush.drawImage(held, call.across, call.down, call['draw-wide'], call['draw-high']);
}

function fontOf(piece) {
  return (piece.italic ? 'italic ' : '') + (piece.bold ? 'bold ' : '')
      + piece.size + 'px "Jebol Carried", sans-serif';
}

function writeTheText(call) {
  if (call.selection && call.selection.length) {
    brush.fillStyle = call['selection-colour'];
    for (const patch of call.selection) {
      brush.fillRect(patch.across, patch.top, patch.wide, patch.high);
    }
  }
  if (call.shadow) {
    writeThePieces(call.lines, call.shadow.across, call.shadow.down, call.shadow.colour);
  }
  writeThePieces(call.lines, 0, 0, null);
  if (call.caret) {
    brush.fillStyle = call.caret.colour;
    brush.fillRect(call.caret.across, call.caret.top, call.caret.wide, call.caret.high);
  }
}

function writeThePieces(lines, movedAcross, movedDown, everyPieceIn) {
  for (const line of lines) {
    for (const piece of line.pieces) {
      brush.font = fontOf(piece);
      brush.fillStyle = everyPieceIn || piece.colour;
      brush.fillText(piece.text, piece.across + movedAcross, piece.baseline + movedDown);
    }
  }
}

function asGradient(fill) {
  const run = fill.gradient === 'radial'
      ? brush.createRadialGradient(
          fill['across-start'], fill['down-start'], 0,
          fill['across-start'], fill['down-start'], fill.radius)
      : brush.createLinearGradient(
          fill['across-start'], fill['down-start'],
          fill['across-end'], fill['down-end']);
  for (const stop of fill.stops) {
    run.addColorStop(Math.min(1, Math.max(0, stop.at)), stop.colour);
  }
  return run;
}

function asPath(steps) {
  const shape = new Path2D();
  const turn = Math.PI / 180;
  for (const piece of steps) {
    if (piece.step === 'move-to') {
      shape.moveTo(piece.across, piece.down);
    } else if (piece.step === 'line-to') {
      shape.lineTo(piece.across, piece.down);
    } else if (piece.step === 'quadratic-to') {
      shape.quadraticCurveTo(piece['control-across'], piece['control-down'],
          piece.across, piece.down);
    } else if (piece.step === 'cubic-to') {
      shape.bezierCurveTo(piece['control-across'], piece['control-down'],
          piece['second-across'], piece['second-down'],
          piece.across, piece.down);
    } else if (piece.step === 'ellipse-at') {
      shape.moveTo(piece.across + piece['radius-across'], piece.down);
      shape.ellipse(piece.across, piece.down,
          piece['radius-across'], piece['radius-down'], 0, 0, Math.PI * 2);
    } else if (piece.step === 'arc-to') {
      if (piece.closes) shape.moveTo(piece.across, piece.down);
      shape.ellipse(piece.across, piece.down,
          piece['radius-across'], piece['radius-down'], 0,
          piece.begins * turn, (piece.begins + piece.turns) * turn);
      if (piece.closes) shape.closePath();
    } else if (piece.step === 'close') {
      shape.closePath();
    }
  }
  return shape;
}

function asImageData(step) {
  const raw = atob(step.pixels);
  const octets = new Uint8ClampedArray(raw.length);
  for (let at = 0; at < raw.length; at++) octets[at] = raw.charCodeAt(at);
  return new ImageData(octets,
      step['pixel-wide'] || step.wide, step['pixel-high'] || step.high);
}

const out = [];
const shown = document.createElement('pre');
shown.id = 'out';
shown.textContent = '';

function runTheScriptIn(tagId) {
  const tag = document.getElementById(tagId);
  if (tag.textContent.trim().length > 0) {
    return Promise.resolve(tag.textContent);
  }
  return fetch(tag.src).then(response => response.text());
}

function handOverTheScriptIn(tagId) {
  runTheScriptIn(tagId).then(source => theWorker.postMessage({ run: source }));
}

function theWorkerSays(message) {
  const said = typeof message.data === 'string' ? JSON.parse(message.data) : message.data;
  if (said.type === 'paint') {
    paint(said.picture);
  } else if (said.type === 'printed') {
    out.push(said.text);
    shown.textContent = out.join('');
  } else if (said.type === 'booted') {
    handOverTheScriptIn('rebol');
  } else if (said.type === 'finished') {
    out.push(said.text);
    shown.textContent = out.join('');
    handOverTheScriptIn('gui');
  } else if (said.type === 'failed') {
    out.push('failed ' + said.text);
    shown.textContent = out.join('');
  }
}

const theWorker = new Worker('jebol-worker.js');
theWorker.onmessage = theWorkerSays;
theWorker.onerror = problem => {
  out.push('worker error ' + problem.message);
  shown.textContent = out.join('');
};
document.body.appendChild(shown);

function tellTheWorker(fields) {
  theWorker.postMessage(fields);
}

function sayHowBigWeAre() {
  tellTheWorker({ type: 'measure', wide: window.innerWidth, high: window.innerHeight });
}

const keysThatTypeNothing = {
  PageUp: 'page-up', PageDown: 'page-down', End: 'end', Home: 'home',
  ArrowLeft: 'left', ArrowUp: 'up', ArrowRight: 'right', ArrowDown: 'down',
  Insert: 'insert',
  F1: 'f1', F2: 'f2', F3: 'f3', F4: 'f4', F5: 'f5', F6: 'f6',
  F7: 'f7', F8: 'f8', F9: 'f9', F10: 'f10', F11: 'f11', F12: 'f12',
  Shift: 'shift', Control: 'control', Alt: 'alt', Pause: 'pause', CapsLock: 'capital'
};
const keysThatTypeAControlCharacter = {
  Backspace: 8, Tab: 9, Enter: 13, Escape: 27, Delete: 127
};

function tellWhereThePointerIs(kind, pointer) {
  tellTheWorker({ type: kind, across: Math.round(pointer.offsetX), down: Math.round(pointer.offsetY) });
}

function theCharacterTyped(pressed) {
  if (pressed.key in keysThatTypeAControlCharacter) {
    return keysThatTypeAControlCharacter[pressed.key];
  }
  return [...pressed.key].length === 1 ? pressed.key.codePointAt(0) : null;
}

function tellTheKey(pressed, typing, naming) {
  if (pressed.key in keysThatTypeNothing) {
    tellTheWorker({ type: naming, named: keysThatTypeNothing[pressed.key] });
    return;
  }
  const typed = theCharacterTyped(pressed);
  if (typed !== null) {
    tellTheWorker({ type: typing, code: typed });
  }
}

window.addEventListener('resize', sayHowBigWeAre);
canvas.addEventListener('mousedown', pointer => tellWhereThePointerIs('down', pointer));
canvas.addEventListener('mouseup', pointer => tellWhereThePointerIs('up', pointer));
canvas.addEventListener('mousemove', pointer => tellWhereThePointerIs('move', pointer));
window.addEventListener('keydown', pressed => tellTheKey(pressed, 'key', 'control'));
window.addEventListener('keyup', pressed => tellTheKey(pressed, 'key-up', 'control-up'));
window.addEventListener('beforeunload', () => tellTheWorker({ type: 'close' }));

document.fonts.load('12px "Jebol Carried"').then(() => {
  if (theLastPicture) paint(theLastPicture);
});

sayHowBigWeAre();
</script>
</body>
</html>
